services:
  postgres:
    image: postgres:16-alpine
    container_name: exam_platform_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-exam_platform}
      POSTGRES_USER: ${DB_USERNAME:-exam_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-exam_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-exam_user} -d ${DB_DATABASE:-exam_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      target: dev
    container_name: exam_platform_api
    restart: unless-stopped
    # Runs as the host user so files written to the mounted code stay editable.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      HOME: /tmp
      DB_HOST: postgres
      DB_PORT: 5432
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
