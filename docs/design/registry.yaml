# docs/design/registry.yaml — every screen and shared component, by DS- ID.
# Plans, commits, mocks and board files use the ID (tickets don't). kind: foundation | component | screen
# status: draft (mock drawn) | approved (confirmed on the board) | implemented | deprecated (never delete an entry)
designs:
  - id: DS-001
    name: auth-login
    kind: screen
    status: implemented
    source: frontend/src/pages/LoginPage.tsx
    description: Login screen for candidates, examiners, and administrators with email and password
  - id: DS-002
    name: auth-register
    kind: screen
    status: implemented
    source: frontend/src/pages/RegisterPage.tsx
    description: Candidate self-registration screen with email and password
  - id: DS-003
    name: candidate-dashboard
    kind: screen
    status: approved
    description: Candidate dashboard displaying available exams, ongoing attempts, and past published grades
  - id: DS-004
    name: exam-room
    kind: screen
    status: approved
    description: Active exam taking room with authoritative server countdown, autosave sync indicator, question drawer navigation, Subject 1 & 2 inputs, and submission modal
  - id: DS-005
    name: exam-results-review
    kind: screen
    status: draft
    description: Candidate post-grading read-only review with score breakdown, correct answers, and examiner feedback
  - id: DS-006
    name: examiner-dashboard
    kind: screen
    status: draft
    description: Examiner dashboard with summary cards for active exams, live candidate attempts, and pending grading queue
  - id: DS-007
    name: question-bank-manager
    kind: screen
    status: approved
    description: Question bank manager for creating, tagging, filtering, and previewing the 60 questions and parameter variations
  - id: DS-008
    name: exam-builder
    kind: screen
    status: approved
    description: Exam template builder configuring pool rules, timer duration, Subject 1 & 2 point allocations, and availability windows
  - id: DS-009
    name: manual-grading-queue
    kind: screen
    status: approved
    description: Examiner interface for reviewing Subject 2 multi-step submissions with rubric scoring, partial credit, and individualized feedback
  - id: DS-010
    name: item-analysis-analytics
    kind: screen
    status: draft
    description: Psychometric analytics dashboard displaying item difficulty %, item-total discrimination index, distractor frequency, class average, and median
  - id: DS-011
    name: admin-user-management
    kind: screen
    status: approved
    description: Administrator users list with search; sets a temporary password, creates Examiner accounts, deactivates users (D-054, D-055, D-056)
  - id: DS-012
    name: admin-exam-supervision
    kind: screen
    status: draft
    description: Administrator overview providing platform-wide directory and supervision of all exams
  - id: DS-013
    name: examiner-classes
    kind: screen
    status: implemented
    source: frontend/src/pages/examiner/ClassesPage.tsx
    description: Examiner classes with join codes, pending join requests to accept or decline, and the roster (D-015, D-028); new passwords moved to DS-011 (D-054)
  - id: DS-014
    name: app-header
    kind: component
    status: implemented
    source: frontend/src/components/AppHeader.tsx
    description: Top bar with the brand, RO/EN toggle, theme toggle and log-out (signed in); the toggles stay visible on mobile auth screens (from DS-001/DS-002)
  - id: DS-015
    name: form-controls
    kind: component
    status: implemented
    source: frontend/src/components/ (Button.tsx, TextField.tsx, PasswordField.tsx, Alert.tsx)
    description: Button (primary, secondary, ghost, loading), text field and password field with label, help and error code text, and the alert banner (error, info) from mock.css
  - id: DS-016
    name: session-loading
    kind: screen
    status: implemented
    source: frontend/src/components/SessionLoading.tsx
    description: Shown while a saved session is checked at start-up (GET /api/user); spinner, then the server-waking notice after 5 s (Render free-tier cold start)
  - id: DS-017
    name: modal
    kind: component
    status: implemented
    source: frontend/src/components/Modal.tsx
    description: Dialog and right-side drawer (mock.css .modal, mock.js .drawer) - labelled by its title, focus moves in and returns, Tab stays inside, Escape closes
  - id: DS-018
    name: auth-change-password
    kind: screen
    status: approved
    description: Forced new-password screen after sign-in while the password is temporary; two hidden fields, must differ from the temporary one; sign-out link (D-054)
