# docs/design/registry.yaml — every screen and shared component, by DS- ID.
# Plans, commits, mocks and board files use the ID (tickets don't). kind: foundation | component | screen
# status: draft (mock drawn) | approved (confirmed on the board) | implemented | deprecated (never delete an entry)
designs:
  - id: DS-001
    name: auth-login
    kind: screen
    status: implemented
    source: frontend/src/pages/LoginPage.tsx
    description: Login screen for candidates, examiners, and administrators with email and password
  - id: DS-002
    name: auth-register
    kind: screen
    status: implemented
    source: frontend/src/pages/RegisterPage.tsx
    description: Candidate self-registration screen with email and password
  - id: DS-003
    name: candidate-dashboard
    kind: screen
    status: implemented
    source: frontend/src/pages/candidate/DashboardPage.tsx
    description: Candidate dashboard - the in-progress Attempt, exam cards by state (open, upcoming, submitted awaiting grading, submitted with attempts left) with topic chips only (Q-069) and the description (Q-064), empty states (no class, request waiting, no exams) and the join-class dialog (D-028); no submitted-exams table until P9 (Q-070). P7a additions drawn 2026-11-25; the app's own header is kept (user, 2026-11-25), not the mock's name and avatar; P8b: a results-published card with the counted grade and "Vezi rezultatele"
  - id: DS-004
    name: exam-room
    kind: screen
    status: implemented
    source: frontend/src/pages/candidate/ExamRoomPage.tsx
    description: Active exam taking room with authoritative server countdown, autosave sync indicator, question drawer navigation, Subject 1 & 2 inputs, and submission modal; P7b additions drawn 2026-11-25: one item per screen (Q-072), multiple choice, true/false, short answer, Subject II text only (Q-070; photos in P6d), save failed, time up until P7c; P7c additions drawn, confirmed and built 2026-11-25; "Fără conexiune" built in P7d; P6d additions drawn, confirmed and built 2026-11-26: a refused photo upload, the confirmation before deleting a photo; each photo with its name, size and a labelled "Șterge" button below it, no badge on the photo (user, 2026-11-26): the 1-minute notice, "Examen predat" after submitting, submitting blocked by an unsaved answer
  - id: DS-005
    name: exam-results-review
    kind: screen
    status: implemented
    source: frontend/src/pages/candidate/ResultsPage.tsx
    description: The Candidate's results after publication (P8b, D-019): grade and scores, cohort note, Subject I answers with the correct answer and the explanation (Q-082), Subject II steps, photos, barem points earned, adjustment and comment (Q-083), several Attempts with the counted one (D-012, Q-084), no class statistics (Q-085); not published yet, loading, error
  - id: DS-006
    name: examiner-dashboard
    kind: screen
    status: draft
    description: Examiner dashboard with summary cards for active exams, live candidate attempts, and pending grading queue
  - id: DS-007
    name: question-bank-manager
    kind: screen
    status: implemented
    source: frontend/src/pages/examiner/QuestionBankPage.tsx (+ questions/)
    description: Examiner question bank: filters (competence, topic, pool, type, grade, difficulty, status), editor with every field an Item matches on, named values (fixed, random with exclusions, calculated), Draft/Ready checklist, shared library (D-057, D-058, D-059, D-040); P8c: after a corrected answer key on a drawn question, a notice with the re-graded count and the last corrections; refusals for the type and Subject, options and named values once drawn (D-046, Q-087–Q-090, Q-092)
  - id: DS-008
    name: exam-builder
    kind: screen
    status: implemented
    source: frontend/src/pages/examiner/ExamsPage.tsx, ExamBuilderPage.tsx (+ exams/)
    description: Exam builder: settings with grade level, blueprint Items drawing from a pool by competence, difficulty, type and topic (each may be any) with live match counts, Item editor, publish checks, preview as a Candidate, Examene list, publish confirmation, locked published exam, deleting a draft, link to grading with progress, end date locked once results are published, Subject II Item fixed at 20 points (D-057, D-062, Q-059–Q-062, Q-081)
  - id: DS-009
    name: manual-grading-queue
    kind: screen
    status: implemented
    source: frontend/src/pages/examiner/GradingPage.tsx (+ grading/)
    description: Examiner grading of Subject II answers by item or by Candidate, barem ticked Nu / Parțial / Da or one score, adjustment and comment, hidden names, re-check marks, inline barem editor, publish readiness (re-check, running Attempts, end date) and publishing with the cohort note (D-019, D-031, Q-076, Q-078, Q-079, Q-080)
  - id: DS-010
    name: item-analysis-analytics
    kind: screen
    status: implemented
    source: frontend/src/pages/examiner/ItemAnalysisPage.tsx
    description: Examiner's Item Analysis of one exam (P10, D-047, C-008): counted Attempts, mean and median; a foldable legend; per competence its success rate (Reușită = p) and weak Items; per Item success rate, discrimination and flags, opening to its drawn Variants with their options and unused marks; a notice when answers await re-check, one notice instead of tables below 2 graded Attempts
  - id: DS-011
    name: admin-user-management
    kind: screen
    status: implemented
    source: frontend/src/pages/admin/UsersPage.tsx
    description: Administrator users list with search; sets a temporary password, creates Examiner accounts, deactivates users (D-054, D-055, D-056); the page is capped at the desktop width (1024 px, centred) so the table has no empty band
  - id: DS-012
    name: admin-exam-supervision
    kind: screen
    status: draft
    description: Administrator overview providing platform-wide directory and supervision of all exams
  - id: DS-013
    name: examiner-classes
    kind: screen
    status: implemented
    source: frontend/src/pages/examiner/ClassesPage.tsx
    description: Examiner classes with join codes, pending join requests to accept or decline, and the roster without an actions column until Q-041 (D-015, D-028); new passwords moved to DS-011 (D-054)
  - id: DS-014
    name: app-header
    kind: component
    status: implemented
    source: frontend/src/components/AppHeader.tsx
    description: Top bar with the brand, RO/EN toggle, theme toggle and log-out (signed in); the toggles stay visible on mobile auth screens (from DS-001/DS-002)
  - id: DS-015
    name: form-controls
    kind: component
    status: implemented
    source: frontend/src/components/ (Button.tsx, TextField.tsx, PasswordField.tsx, SelectField.tsx, Alert.tsx)
    description: Button (primary, secondary, danger, ghost, loading), text field, password field and select (native, theme chevron, PATTERN-002) with label, help and error code text, and the alert banner (error, info, success) from mock.css
  - id: DS-016
    name: session-loading
    kind: screen
    status: implemented
    source: frontend/src/components/SessionLoading.tsx
    description: Shown while a saved session is checked at start-up (GET /api/user); spinner, then the server-waking notice after 5 s (Render free-tier cold start)
  - id: DS-017
    name: modal
    kind: component
    status: implemented
    source: frontend/src/components/Modal.tsx
    description: Dialog (or alertdialog for a confirmation that can't be undone), right-side drawer (mock.css .modal, mock.js .drawer) and bottom sheet (DS-004 navigator on phones) - labelled by its title, focus moves in and returns, Tab stays inside, Escape closes, scrolls when taller than the screen; its buttons sit in `DialogActions` (mock.css .modal-actions): equal halves of the row, a third action (delete) on a row of its own (2026-11-25)
  - id: DS-018
    name: auth-change-password
    kind: screen
    status: implemented
    source: frontend/src/pages/ChangePasswordPage.tsx
    description: Forced new-password screen after sign-in while the password is temporary; two hidden fields, must differ from the temporary one; sign-out link (D-054)
