# Render blueprint (D-014): managed PostgreSQL 16, the Laravel API from backend/Dockerfile
# (its last stage, `prod`), and the SPA as a static site. Secrets are set in the Render
# dashboard (sync: false) and never committed.
databases:
  - name: exam-platform-db
    plan: free
    postgresMajorVersion: "16"
    databaseName: exam_platform
    user: exam_user

services:
  - type: web
    name: exam-platform-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: array
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: exam-platform-db
          property: connectionString

  - type: web
    name: exam-platform-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
