# Render blueprint (D-014): managed PostgreSQL 16, the Laravel API from backend/Dockerfile
# (its last stage, `prod`), and the SPA as a static site. Secrets are set in the Render
# dashboard (sync: false) and never committed.
databases:
  - name: exam-platform-db
    plan: free
    postgresMajorVersion: "16"
    databaseName: exam_platform
    user: exam_user

services:
  - type: web
    name: exam-platform-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      # D-048, Q-066: Subject II photos in Cloudflare R2; the AWS_* values are set in the dashboard.
      - key: FILESYSTEM_DISK
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: auto
      - key: AWS_BUCKET
        value: exam-platform-photos
      - key: AWS_ENDPOINT
        sync: false
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "true"
      # D-044, Q-067: the external cron's secret for POST /api/cron/seal-expired; set in the dashboard.
      - key: CRON_SECRET
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: array
      - key: DB_CONNECTION
        value: pgsql
      - key: FRONTEND_URL
        value: https://exam-platform-web-ip0s.onrender.com
      - key: DB_URL
        fromDatabase:
          name: exam-platform-db
          property: connectionString

  - type: web
    name: exam-platform-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
